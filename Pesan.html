<!-- section pesan / order -->
<div class="wrapper">
    <section id="pesan">
        <div class="kolom">
            <h2 style="color: #f0960e;">Pesan Sekarang</h2>
            <p class="deskripsi">Langsung pesan menu favoritmu, kami antar kehangatan tradisi sampai rumah.</p>
        </div>
        <div class="pesan-container">
            <form class="form-pesan">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Bang Rap" required>
                <label>Nomor WhatsApp</label>
                <input type="tel" placeholder="085646428798" required>
                <label>Pilih Menu</label>
                <select>
                    <option>Paket Nusantara Komplit</option>
                    <option>Rendang Padang Asli</option>
                    <option>Sate Lilit Bali</option>
                </select>
                <label>Jumlah Pesan</label>
                <input type="number" placeholder="1" min="1">
                <label>Catatan / Alamat</label>
                <textarea rows="4" placeholder="Tulis alamat lengkap & catatan..."></textarea>
                <button type="submit" class="btn-kirim">Kirim Pesan via WhatsApp</button>
            </form>
            <img src="images/pesan.png" class="gambar-pesan" />
        </div>
    </section>
</div>
